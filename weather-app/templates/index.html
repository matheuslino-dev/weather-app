<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            overflow: hidden;
        }

        .background-blur{
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(120px);
            top: -100px;
            right: -100px;
        }

        .weather-card{
            width: 100%;
            max-width: 500px;

            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 25px;

            padding: 40px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.3);

            position: relative;
            z-index: 1;
        }

        .title{
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle{
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        .form-control{
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;

            padding: 14px;
            border-radius: 12px;
        }

        .form-control:focus{
            background: rgba(255,255,255,0.2);
            color: white;
            box-shadow: none;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-control::placeholder{
            color: rgba(255,255,255,0.7);
        }

        .btn-weather{
            width: 100%;
            margin-top: 20px;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: white;
            color: #0f172a;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn-weather:hover{
            transform: translateY(-2px);
            background: #e2e8f0;
        }

        .weather-result{
            margin-top: 35px;
            text-align: center;
        }

        .weather-main{
            font-size: 1.5rem;
            font-weight: bold;
        }

        .weather-description{
            color: rgba(255,255,255,0.8);
            text-transform: capitalize;
        }

        .temperature{
            font-size: 4rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .weather-icon{
            width: 120px;
        }

        .divider{
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 25px 0;
        }

        .footer-text{
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .alert{
            margin-top: 20px;
            border-radius: 12px;
        }

        @media(max-width: 576px){

            .weather-card{
                margin: 20px;
                padding: 30px 20px;
            }

            .title{
                font-size: 2rem;
            }

            .temperature{
                font-size: 3rem;
            }

        }
    </style>
</head>

<body>

    <div class="background-blur"></div>

    <div class="weather-card">

        <div class="text-center">
            <h1 class="title">🌤 Weather App</h1>

            <p class="subtitle">
                Check the weather of any city in real time
            </p>
        </div>

        <form action="/" method="post">

            <div class="mb-3">
                <input 
                    type="text"
                    id="cityName"
                    name="cityName"
                    placeholder="Enter a city..."
                    class="form-control"
                    required
                >
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <input 
                        type="text"
                        id="stateName"
                        name="stateName"
                        value="SP"
                        class="form-control"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <input 
                        type="text"
                        id="countryName"
                        name="countryName"
                        value="BR"
                        class="form-control"
                    >
                </div>

            </div>

            <button type="submit" class="btn-weather">
                Search Weather
            </button>

        </form>

        {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
        {% endif %}

        {% if data %}

        <div class="divider"></div>

        <div class="weather-result">

            <div class="weather-main">
                {{ data.main }}
            </div>

            <div class="weather-description">
                {{ data.description }}
            </div>

            <img 
                src="https://openweathermap.org/img/wn/{{data.icon}}@4x.png"
                alt="weather icon"
                class="weather-icon"
            >

            <div class="temperature">
                {{ data.temperature }}°C
            </div>

        </div>

        {% endif %}

        <div class="footer-text">
            Powered by OpenWeatherMap API
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
