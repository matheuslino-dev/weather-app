<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSV Color Wheel – Harmonious Palettes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0b0b0b;
            color:#e0e0e0;
            font-family:'Inter', sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        h1{
            font-weight:600;
            font-size:2rem;
            margin-bottom:25px;
            letter-spacing:-0.5px;
            color:#fff;
        }

        .main-container{
            display:flex;
            gap:35px;
            align-items:flex-start;
            flex-wrap:wrap;
            justify-content:center;
        }

        /* Wheel */

        .wheel-wrapper{
            position:relative;
            flex-shrink:0;
        }

        canvas{
            width:400px;
            height:400px;
            border-radius:50%;
            box-shadow:0 0 60px rgba(0,0,0,0.9);
            cursor:crosshair;
            transition:box-shadow 0.3s;
        }

        canvas:hover{
            box-shadow:0 0 70px rgba(0,180,180,0.3);
        }

        /* Main tooltip */

        .tooltip{
            position:fixed;
            pointer-events:none;
            background:rgba(20,20,20,0.95);
            backdrop-filter:blur(12px);
            color:#fff;
            padding:8px 14px;
            border-radius:10px;
            font-size:14px;
            font-family:'Courier New', monospace;
            font-weight:bold;
            display:flex;
            align-items:center;
            gap:10px;
            box-shadow:0 6px 20px rgba(0,0,0,0.7);
            z-index:9999;
            white-space:nowrap;
            border:1px solid rgba(255,255,255,0.1);
        }

        .tooltip .swatch{
            width:18px;
            height:18px;
            border-radius:4px;
            border:1px solid #888;
        }

        /* Palette tooltip */

        .palette-tooltip{
            position:fixed;
            pointer-events:none;
            background:rgba(30,30,30,0.95);
            backdrop-filter:blur(8px);
            color:#fff;
            padding:6px 12px;
            border-radius:8px;
            font-size:12px;
            font-family:'Courier New', monospace;
            box-shadow:0 4px 15px rgba(0,0,0,0.6);
            z-index:9998;
            white-space:nowrap;
            display:none;
            border:1px solid rgba(255,255,255,0.15);
        }

        /* Sidebar */

        .sidebar{
            background:#141414;
            border-radius:20px;
            padding:28px;
            width:360px;
            max-width:100%;
            box-shadow:0 15px 40px rgba(0,0,0,0.8);
            display:flex;
            flex-direction:column;
            gap:28px;
            border:1px solid #2a2a2a;
        }

        .preview-box{
            width:100%;
            height:120px;
            border-radius:14px;
            border:2px solid #333;
            background:#1a1a1a;
            transition:background 0.2s;
            box-shadow:inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .info-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .info-item{
            background:#1e1e1e;
            border-radius:10px;
            padding:12px;
            border:1px solid #2c2c2c;
            transition:background 0.2s;
        }

        .info-item:hover{
            background:#252525;
        }

        .info-item .label{
            font-size:0.65rem;
            text-transform:uppercase;
            letter-spacing:1.5px;
            color:#888;
            margin-bottom:5px;
            font-weight:600;
        }

        .info-item .value{
            font-family:'Courier New', monospace;
            font-size:0.9rem;
            word-break:break-all;
            color:#ddd;
        }

        /* Palettes */

        .palette-section h3{
            font-weight:500;
            font-size:1.2rem;
            margin-bottom:15px;
            color:#ccc;
            display:flex;
            align-items:center;
            gap:8px;
        }

        .palette-group{
            margin-bottom:20px;
        }

        .palette-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:8px;
        }

        .palette-label{
            font-size:0.8rem;
            color:#aaa;
            font-weight:500;
        }

        .copy-btn{
            background:#2a2a2a;
            border:none;
            color:#aaa;
            font-size:0.7rem;
            padding:4px 10px;
            border-radius:6px;
            cursor:pointer;
            transition:all 0.2s;
            display:flex;
            align-items:center;
            gap:4px;
        }

        .copy-btn:hover{
            background:#3a3a3a;
            color:#fff;
        }

        .copy-btn:active{
            transform:scale(0.95);
        }

        .palette-row{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .palette-swatch{
            width:42px;
            height:42px;
            border-radius:10px;
            border:2px solid #333;
            transition:all 0.2s;
            cursor:pointer;
            position:relative;
        }

        .palette-swatch:hover{
            transform:scale(1.2);
            border-color:#fff;
            box-shadow:0 4px 15px rgba(0,0,0,0.6);
            z-index:5;
        }

        /* Slider */

        .slider-container{
            display:flex;
            align-items:center;
            gap:12px;
        }

        #saturation-slider{
            flex:1;
            accent-color:#4cafaf;
            height:6px;
            border-radius:3px;
        }

        #saturation-value{
            font-family:'Courier New', monospace;
            font-size:0.9rem;
            color:#ccc;
            min-width:45px;
        }

        /* Footer */

        .footer{
            margin-top:30px;
            color:#555;
            font-size:0.75rem;
        }
        

    </style>
    
</head>

<body>

    <h1>HSV Color Wheel</h1>

    <div class="main-container">

        <div class="wheel-wrapper">

            <canvas id="wheel" width="800" height="800"></canvas>

            <div id="color-tooltip" class="tooltip">
                <span class="swatch"></span>
                <span class="hex-text"></span>
            </div>

        </div>

        <div class="sidebar">

            <div id="preview" class="preview-box"></div>

            <div class="info-grid">

                <div class="info-item">
                    <div class="label">Name</div>
                    <div class="value" id="val-name">—</div>
                </div>

                <div class="info-item">
                    <div class="label">HEX</div>
                    <div class="value" id="val-hex">—</div>
                </div>

                <div class="info-item">
                    <div class="label">RGB</div>
                    <div class="value" id="val-rgb">—</div>
                </div>

                <div class="info-item">
                    <div class="label">HSL</div>
                    <div class="value" id="val-hsl">—</div>
                </div>

                <div class="info-item">
                    <div class="label">HSV</div>
                    <div class="value" id="val-hsv">—</div>
                </div>

                <div class="info-item">
                    <div class="label">XYZ</div>
                    <div class="value" id="val-xyz">—</div>
                </div>

            </div>

            <div class="palette-section">

                <h3>🧩 Harmonic Palettes</h3>

                <div class="palette-group">

                    <div class="palette-header">
                        <span class="palette-label">Complementary</span>
                        <button class="copy-btn" data-palette="complementary">
                            Copy
                        </button>
                    </div>

                    <div class="palette-row" id="palette-complementary"></div>

                </div>

                <div class="palette-group">

                    <div class="palette-header">
                        <span class="palette-label">Analogous</span>
                        <button class="copy-btn" data-palette="analogous">
                            Copy
                        </button>
                    </div>

                    <div class="palette-row" id="palette-analogous"></div>

                </div>

                <div class="palette-group">

                    <div class="palette-header">
                        <span class="palette-label">Triadic</span>
                        <button class="copy-btn" data-palette="triadic">
                            Copy
                        </button>
                    </div>

                    <div class="palette-row" id="palette-triadic"></div>

                </div>

                <div class="palette-group">

                    <div class="palette-header">
                        <span class="palette-label">Tetradic</span>
                        <button class="copy-btn" data-palette="tetradic">
                            Copy
                        </button>
                    </div>

                    <div class="palette-row" id="palette-tetradic"></div>

                </div>

                <div class="palette-group">

                    <div class="palette-header">
                        <span class="palette-label">Monochromatic</span>
                        <button class="copy-btn" data-palette="monochromatic">
                            Copy
                        </button>
                    </div>

                    <div class="palette-row" id="palette-monochromatic"></div>

                </div>

                <div class="slider-container" style="margin-top:10px;">

                    <span class="palette-label" style="margin-bottom:0;">
                        Saturation
                    </span>

                    <input
                        type="range"
                        id="saturation-slider"
                        min="0"
                        max="100"
                        value="100"
                        step="1"
                    >

                    <span id="saturation-value">100%</span>

                </div>

            </div>

        </div>

    </div>

    <div id="palette-tooltip" class="palette-tooltip"></div>

    <script src="/static/script.js"></script>

</body>
</html>
